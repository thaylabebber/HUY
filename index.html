<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="maquina">
  <h1>ENIGMA</h1>
  <p class="dica">Clique nas teclas ou use o teclado do computador.</p>

  <!-- As janelas mostram a posição ATUAL de cada rotor (esquerdo, meio, direito).
       Você pode editá-las para definir a chave inicial. -->
  <div class="janelas">
    <input id="j0" maxlength="1" value="A">
    <input id="j1" maxlength="1" value="A">
    <input id="j2" maxlength="1" value="A">
  </div>

  <!-- Estas duas caixas começam VAZIAS: o JavaScript cria as 26 lâmpadas e as 26 teclas.
       Assim não precisamos escrever 52 elementos à mão. -->
  <div id="lampadas"></div>
  <div id="teclado"></div>

  <p class="rotulo">ENTRADA (o que você digitou)</p>
  <div class="linha" id="entrada"></div>

  <p class="rotulo">SAÍDA (as lâmpadas que acenderam)</p>
  <div class="linha" id="saida"></div>

  <p class="rotulo">CAMINHO DA ÚLTIMA LETRA</p>
  <div class="linha" id="caminho"></div>

  <button class="acao" id="btnReiniciar">Reiniciar rotores e mensagem</button>
</div>

</body>
</html>
